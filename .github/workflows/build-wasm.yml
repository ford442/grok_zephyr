name: Build WASM

on:
  push:
    branches:
      - main
    paths:
      - 'native/**'
      - '.github/workflows/build-wasm.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'

      - name: Build SGP4 WASM
        run: npm run build:wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Catches C++/TypeScript drift: the GPU mean elements C++ packs must
      # still match src/physics/sgp4NearEarth.ts (the WGSL mirror), and the
      # near-earth SIMD kernel must still agree with the satellite.js oracle.
      - name: Check freshly built WASM against the TypeScript reference
        run: npx vitest run src/physics/sgp4CatalogAuthority.test.ts src/physics/sgp4NearEarth.test.ts src/physics/Sgp4WasmEngine.test.ts

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sgp4-wasm
          path: |
            public/sgp4.wasm
            public/sgp4.js
          if-no-files-found: error

      - name: Verify prebuilt WASM is committed on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git diff --exit-code public/sgp4.wasm public/sgp4.js || \
            (echo "::error::public/sgp4.{wasm,js} differ from committed copies. Run npm run build:wasm and commit." && exit 1)
